<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Spotyy_AA</title>
  <meta name="description" content="Reproductor musical premium y sistema independiente Spotyy_AA." />
  <meta property="og:title" content="Spotyy_AA" />
  <meta property="og:description" content="Reproductor musical premium y sistema independiente Spotyy_AA." />

  <!-- Metadatos PWA y Manifest para iOS (iPhone / iPad) y Android -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#121212" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Meta Tags Nativas para Apple iOS / Safari PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Spotyy_AA" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Iconos de Aplicación PWA y Apple Touch Icon para iPhone / iPad -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" href="/icono-app.png" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  
  <!-- jsmediatags CDN para extracción de metadatos ID3 y portadas de audio MP3 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#121212] text-white font-sans antialiased m-0 p-0 overflow-x-hidden select-none safe-min-h-screen">
  <div id="root"></div>

  <!-- Registro de Service Worker para PWA e Instalación en Android -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('PWA Service Worker listo:', reg.scope))
          .catch((err) => console.warn('PWA SW registro opcional:', err));
      });
    }
  </script>

  <!-- Punto de Entrada de la Aplicación React -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
